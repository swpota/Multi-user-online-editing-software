<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - MindFlow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .offline-container {
      background: white;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }

    .offline-icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }

    .offline-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 16px;
    }

    .offline-description {
      font-size: 16px;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .offline-button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .offline-button-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .offline-button-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .offline-button-secondary {
      background: #f7fafc;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .offline-button-secondary:hover {
      background: #edf2f7;
    }

    .offline-tips {
      margin-top: 32px;
      padding: 20px;
      background: #f7fafc;
      border-radius: 10px;
      text-align: left;
    }

    .offline-tips-title {
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .offline-tips-list {
      list-style: none;
      padding: 0;
    }

    .offline-tips-list li {
      font-size: 14px;
      color: #4a5568;
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
    }

    .offline-tips-list li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #667eea;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      .offline-container {
        padding: 32px 24px;
      }

      .offline-title {
        font-size: 24px;
      }

      .offline-icon {
        width: 100px;
        height: 100px;
      }

      .offline-icon svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24">
        <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9z"/>
        <path d="M9 17l3 3 3-3a4.24 4.24 0 00-6 0z"/>
        <path d="M5 13l2 2a7.074 7.074 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>

    <h1 class="offline-title">您当前处于离线状态</h1>
    <p class="offline-description">
      无法连接到网络。请检查您的网络连接后重试。
    </p>

    <div class="offline-actions">
      <button class="offline-button offline-button-primary" onclick="location.reload()">
        重新连接
      </button>
      <a href="/" class="offline-button offline-button-secondary">
        返回首页
      </a>
    </div>

    <div class="offline-tips">
      <div class="offline-tips-title">💡 温馨提示</div>
      <ul class="offline-tips-list">
        <li>已缓存的文档可以离线查看</li>
        <li>离线编辑将在重新联网后自动同步</li>
        <li>请确保 Wi-Fi 或移动数据已开启</li>
      </ul>
    </div>
  </div>

  <script>
    // 定期检查网络状态
    setInterval(() => {
      if (navigator.onLine) {
        location.reload();
      }
    }, 5000);

    // 监听在线事件
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
